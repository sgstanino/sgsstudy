<SCRIPT LANGUAGE="JavaScript">
//行数
gyou=30;
siki="";
gurafumasu=100

//計算
function keisan(){
	yy = new Array(gyou);
	//式の取り込み
	siki=document.F1.siki.value
	//計算
	for(i=1;i<=gyou;i++){
        //値取り込み
		x=parseFloat(eval("document.F1.x"+i+".value"))

		//表に記入する
		
		eval("document.F1.y"+i+".value=y")
	}
	//グラフを作る
	saisyouti=0
	saidaiti=0

	for(i=1;i<=gyou;i++){
		if(yy[i]>saidaiti){
			saidaiti=yy[i]
		}else if(yy[i]<saisyouti){
			saisyouti=yy[i]
		}
	}
	
	haba=saidaiti-saisyouti
	if(haba==0){
		haba=1;
	}

	hitotubun=haba/gurafumasu*3
	if(saisyouti<0){
		fukosuu=Math.round(-saisyouti/hitotubun)
	}else{
		fukosuu=0
	}
	
	//グラフの個数を書く
	for(i=1;i<=gyou;i++){
		var bou="□";　
		if(yy[i]>0){
			if(fukosuu>0){
				for(k=1;k<=fukosuu;k++){
					bou=bou+"□";
				}
			}
			kosuu=Math.round(yy[i]/hitotubun)
			
			for(j=1;j<=kosuu;j++){
				bou=bou+"●"
			}
		
		}else if(yy[i]<=0){
			kosuu=Math.round(-yy[i]/hitotubun)
			for(k=1;k<=(fukosuu-kosuu);k++){
				bou=bou+"□";
			}
			for(k=1;k<=kosuu;k++){
				bou=bou+"■";
			}
		}
		//alert(i+"番の棒は⇒"+bou)
		eval("document.F1.z"+i+".value=bou")
		
	}
}	

//クリア
function kesu(){
	for(i=1;i<=gyou;i++){
		eval("document.F1.y"+i+".value=''")
		eval("document.F1.z"+i+".value=''")
	}
}
